# Load alongside the same-source modules, or independently.
load_module modules/ngx_http_scdn_log_sync_module.so;
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 4096; }
http {
    scdn_log_sync_config /etc/scdn-log-sync/log-sync.json;
    scdn_log_sync_interval 250ms;
    log_format scdn_json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"client_ip":"$remote_addr","host":"$host","uri":"$uri",'
        '"method":"$request_method","status":$status,"bytes":$body_bytes_sent,'
        '"rt":$request_time,"urt":"$upstream_response_time",'
        '"upstream_status":"$upstream_status","cache":"$upstream_cache_status",'
        '"http_version":"$server_protocol"}';
    access_log /var/log/nginx/access.jsonl scdn_json buffer=64k flush=1s;
    server {
        listen unix:/run/scdn-log-sync/control.sock;
        location = /log-sync-status { access_log off; scdn_log_sync_status; }
    }
}
