name: Native Sync Config Bot Ban Auth API Edge Tier and Purge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: nginx
            linkage: dynamic
          - runtime: openresty
            linkage: dynamic
          - runtime: openresty
            linkage: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: native-auth-guard/adapters/go/go.mod
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl libpcre2-dev libssl-dev zlib1g-dev libcurl4-openssl-dev curl clang libbpf-dev libelf-dev libjson-c-dev iproute2
          python -m pip install -r tests/requirements.txt -r native-api/tools/requirements.txt
      - name: Verify implementation checksums
        run: sha256sum -c SOURCE-SHA256SUMS
      - name: Ban cluster design schema, example and ABI contracts
        run: |
          python -m pip install -r native-ban/tests/requirements.txt
          python native-ban/tests/check-design.py
      - name: Sync core role and identity boundaries
        env:
          PLUGIN_RUNTIME: ${{ matrix.runtime }}
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          sh native-sync/tests/check-core.sh
          if [ "$PLUGIN_RUNTIME" = nginx ]; then
            SCDN_NATIVE_SANITIZERS='-fsanitize=address,undefined -fno-omit-frame-pointer' sh native-sync/tests/check-core.sh
          fi
      - name: Build isolated runtime and all nine plugins
        env:
          PLUGIN_RUNTIME: ${{ matrix.runtime }}
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
        run: |
          if [ "$PLUGIN_RUNTIME" = nginx ]; then
            export SCDN_NATIVE_CFLAGS='-Werror -fsanitize=address,undefined -fno-omit-frame-pointer'
            export SCDN_NATIVE_LDFLAGS='-fsanitize=address,undefined'
            export SCDN_NATIVE_CC="sh $GITHUB_WORKSPACE/tools/sanitizer-cc.sh"
          fi
          sh tools/build-runtime.sh "$RUNNER_TEMP/scdn-plugin" "$PLUGIN_RUNTIME" "$PLUGIN_LINKAGE"
      - name: Auth application adapter, policy snapshot and pinned upstream hooks
        run: |
          (cd native-auth-guard/adapters/go && go test -race -json ./...) > "$RUNNER_TEMP/auth-go-results.jsonl"
          (cd native-auth-guard/tests/backend && go build -o "$RUNNER_TEMP/scdn-auth-backend" .)
          python native-auth-guard/tests/tools.py --report "$RUNNER_TEMP/auth-tools-results.json"
      - name: Auth registration gate, explicit outcomes, concurrency and worker faults
        env:
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
        run: |
          extra=()
          if [ "$PLUGIN_LINKAGE" = static ]; then extra+=(--static); fi
          python native-auth-guard/tests/integration.py --prefix "$RUNNER_TEMP/scdn-plugin" --backend "$RUNNER_TEMP/scdn-auth-backend" "${extra[@]}" --report "$RUNNER_TEMP/auth-runtime-results.json"
      - name: Build native Ban Agent and kernel programs
        env:
          PLUGIN_RUNTIME: ${{ matrix.runtime }}
        run: |
          if [ "$PLUGIN_RUNTIME" = nginx ]; then export BAN_SANITIZERS='-fsanitize=address,undefined -fno-omit-frame-pointer'; fi
          sh native-ban/tools/build-agent.sh "$RUNNER_TEMP/scdn-ban"
      - name: Ban-only memory and persistent store transactions, faults and large IP batches
        env:
          PLUGIN_RUNTIME: ${{ matrix.runtime }}
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          if [ "$PLUGIN_RUNTIME" = nginx ]; then export BAN_SANITIZERS='-fsanitize=address,undefined -fno-omit-frame-pointer'; fi
          sh native-ban-store/tools/build-store.sh "$RUNNER_TEMP/scdn-ban-store"
          python native-ban-store/tests/run.py --build "$RUNNER_TEMP/scdn-ban-store" --count 100000 --report "$RUNNER_TEMP/ban-store-results.json"
          ldd "$RUNNER_TEMP/scdn-ban/scdn-ban-agent" > "$RUNNER_TEMP/ban-linkage.txt"
          if grep -i sqlite "$RUNNER_TEMP/ban-linkage.txt"; then exit 1; fi
      - name: Real Ban kernel enforcement and complete cluster synchronization
        env:
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
          PLUGIN_RUNTIME: ${{ matrix.runtime }}
        run: |
          extra=()
          if [ "$PLUGIN_LINKAGE" = static ]; then extra+=(--static); fi
          sudo --preserve-env=ASAN_OPTIONS,UBSAN_OPTIONS "$(command -v python)" native-ban/tests/runtime.py --prefix "$RUNNER_TEMP/scdn-plugin" --agent-build "$RUNNER_TEMP/scdn-ban" "${extra[@]}" --report "$RUNNER_TEMP/ban-tcx-results.json"
          if [ "$PLUGIN_RUNTIME" = nginx ]; then
            sudo --preserve-env=ASAN_OPTIONS,UBSAN_OPTIONS "$(command -v python)" native-ban/tests/runtime.py --prefix "$RUNNER_TEMP/scdn-plugin" --agent-build "$RUNNER_TEMP/scdn-ban" --mode xdp_native --report "$RUNNER_TEMP/ban-xdp-results.json"
          else
            sudo --preserve-env=ASAN_OPTIONS,UBSAN_OPTIONS "$(command -v python)" native-ban/tests/lua_waf.py --prefix "$RUNNER_TEMP/scdn-plugin" --agent-build "$RUNNER_TEMP/scdn-ban" "${extra[@]}" --report "$RUNNER_TEMP/ban-lua-waf-results.json"
          fi
      - name: Volatile Ban Node reset, live Worker reconnection and authoritative resync
        env:
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
        run: |
          extra=()
          if [ "$PLUGIN_LINKAGE" = static ]; then extra+=(--static); fi
          sudo --preserve-env=ASAN_OPTIONS,UBSAN_OPTIONS "$(command -v python)" native-ban/tests/memory_store.py --prefix "$RUNNER_TEMP/scdn-plugin" --agent-build "$RUNNER_TEMP/scdn-ban" "${extra[@]}" --report "$RUNNER_TEMP/ban-memory-results.json"
      - name: Staggered worker startup and readiness deadlines
        env:
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python tests/worker_startup.py --prefix "$RUNNER_TEMP/scdn-plugin" --report "$RUNNER_TEMP/startup-results.json"
      - name: Native Sync master and node roles, local authentication and mTLS
        env:
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
        run: |
          extra=()
          if [ "$PLUGIN_LINKAGE" = static ]; then extra+=(--static); fi
          python native-sync/tests/integration.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/sync-results.json"
      - name: Encrypted site and certificate publication, hot apply and recovery
        env:
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
        run: |
          extra=()
          if [ "$PLUGIN_LINKAGE" = static ]; then extra+=(--static); fi
          python native-sync/tests/distribution.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/distribution-results.json"
      - name: Application receipt durability and interrupted commit recovery
        env:
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
        run: |
          extra=()
          if [ "$PLUGIN_LINKAGE" = static ]; then extra+=(--static); fi
          python native-sync/tests/recovery.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/receipt-recovery-results.json"
      - name: Retained Lua security with native site and TLS ownership
        if: matrix.runtime == 'openresty'
        env:
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
        run: |
          extra=()
          if [ "$PLUGIN_LINKAGE" = static ]; then extra+=(--static); fi
          python native-sync/tests/lua_handoff.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/lua-handoff-results.json"
      - name: Durable Master Node cache refresh and verified preheat tasks
        env:
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
        run: |
          extra=()
          if [ "$PLUGIN_LINKAGE" = static ]; then extra+=(--static); fi
          python native-sync/tests/cache_tasks.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/cache-task-results.json"
      - name: Configuration, TLS and updates without worker reloads
        env:
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
        run: |
          extra=()
          if [ "$PLUGIN_LINKAGE" = static ]; then extra+=(--static); fi
          python native-edge/tests/integration.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/plugin-results.json"
      - name: Hot cache response and upstream request headers
        env:
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
        run: |
          extra=()
          if [ "$PLUGIN_LINKAGE" = static ]; then extra+=(--static); fi
          python native-edge/tests/cache_headers.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/cache-header-results.json"
      - name: Automatic API detection and real streaming proxy integration
        env:
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
        run: |
          extra=()
          if [ "$PLUGIN_LINKAGE" = static ]; then extra+=(--static); fi
          python native-api/tests/integration.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/api-results.json"
          python native-api/tests/protocols.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/api-protocol-results.json"
          python native-api/tests/media_artifact.py --report "$RUNNER_TEMP/api-media-results.json"
          python native-api/tests/access_phases.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/api-access-results.json"
          python native-bot/tests/integration.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/bot-results.json"
          python native-bot/tests/catalog.py --report "$RUNNER_TEMP/bot-catalog-results.json"
      - name: Five-module coexistence with Sync roles, API streaming and Purge
        env:
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
        run: |
          extra=()
          if [ "$PLUGIN_LINKAGE" = static ]; then extra+=(--static); fi
          python native-api/tests/integration.py --prefix "$RUNNER_TEMP/scdn-plugin" --purge --sync "${extra[@]}" --report "$RUNNER_TEMP/api-purge-sync-results.json"
      - name: Native L1 L2 hierarchy, promotion, expiry and Lua-free restart
        env:
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
        run: |
          extra=()
          if [ "$PLUGIN_LINKAGE" = static ]; then extra+=(--static); fi
          python native-tier/tests/integration.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/tier-results.json"
          python native-tier/tests/boundaries.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/tier-boundary-results.json"
          python native-sync/tests/cache_tasks.py --prefix "$RUNNER_TEMP/scdn-plugin" --tier "${extra[@]}" --report "$RUNNER_TEMP/tier-task-results.json"
          python native-tier/tests/coexist.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/six-module-results.json"
      - name: Exact batch prefix site purge, concurrent writers and recovery
        env:
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
        run: |
          extra=()
          if [ "$PLUGIN_LINKAGE" = static ]; then extra+=(--static); fi
          python native-purge/tests/integration.py --prefix "$RUNNER_TEMP/scdn-plugin" --report "$RUNNER_TEMP/purge-results.json" "${extra[@]}"
      - name: Wildcard regex suffix directory and node invalidation
        env:
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
        run: |
          extra=()
          if [ "$PLUGIN_LINKAGE" = static ]; then extra+=(--static); fi
          python native-purge/tests/patterns.py --prefix "$RUNNER_TEMP/scdn-plugin" --report "$RUNNER_TEMP/pattern-results.json" "${extra[@]}"
      - name: Origin validators, concurrent refresh and finite stale reuse
        env:
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
        run: |
          extra=()
          if [ "$PLUGIN_LINKAGE" = static ]; then extra+=(--static); fi
          python native-purge/tests/revalidate.py --prefix "$RUNNER_TEMP/scdn-plugin" --report "$RUNNER_TEMP/revalidate-results.json" "${extra[@]}"
      - name: Audit identity, receipt capacity, indexed routes and Ban recovery regressions
        env:
          ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tests/asan.supp
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PLUGIN_LINKAGE: ${{ matrix.linkage }}
          PLUGIN_RUNTIME: ${{ matrix.runtime }}
        run: |
          extra=()
          sanitizer=()
          if [ "$PLUGIN_LINKAGE" = static ]; then extra+=(--static); fi
          if [ "$PLUGIN_RUNTIME" = nginx ]; then sanitizer+=(--sanitize); fi
          python native-sync/tests/identity_reassignment.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/identity-reassignment-results.json"
          python native-sync/tests/receipt_capacity.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/receipt-capacity-results.json"
          python native-edge/tests/audit_regressions.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/edge-audit-results.json"
          python native-tier/tests/custom_cache.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/tier-custom-cache-results.json"
          python native-purge/tests/regex_cache.py --prefix "$RUNNER_TEMP/scdn-plugin" "${extra[@]}" --report "$RUNNER_TEMP/regex-cache-results.json"
          sudo --preserve-env=ASAN_OPTIONS,UBSAN_OPTIONS "$(command -v python)" native-ban/tests/recovery.py --agent-build "$RUNNER_TEMP/scdn-ban" "${sanitizer[@]}" --report "$RUNNER_TEMP/ban-recovery-results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-plugins-${{ matrix.runtime }}-${{ matrix.linkage }}-results
          path: |
            ${{ runner.temp }}/auth-go-results.jsonl
            ${{ runner.temp }}/auth-tools-results.json
            ${{ runner.temp }}/auth-runtime-results.json
            ${{ runner.temp }}/startup-results.json
            ${{ runner.temp }}/identity-reassignment-results.json
            ${{ runner.temp }}/receipt-capacity-results.json
            ${{ runner.temp }}/edge-audit-results.json
            ${{ runner.temp }}/tier-custom-cache-results.json
            ${{ runner.temp }}/regex-cache-results.json
            ${{ runner.temp }}/ban-recovery-results.json
            ${{ runner.temp }}/ban-store-results.json
            ${{ runner.temp }}/ban-memory-results.json
            ${{ runner.temp }}/ban-tcx-results.json
            ${{ runner.temp }}/ban-xdp-results.json
            ${{ runner.temp }}/ban-lua-waf-results.json
            ${{ runner.temp }}/sync-results.json
            ${{ runner.temp }}/distribution-results.json
            ${{ runner.temp }}/receipt-recovery-results.json
            ${{ runner.temp }}/lua-handoff-results.json
            ${{ runner.temp }}/tier-results.json
            ${{ runner.temp }}/tier-boundary-results.json
            ${{ runner.temp }}/tier-task-results.json
            ${{ runner.temp }}/six-module-results.json
            ${{ runner.temp }}/cache-task-results.json
            ${{ runner.temp }}/plugin-results.json
            ${{ runner.temp }}/cache-header-results.json
            ${{ runner.temp }}/api-results.json
            ${{ runner.temp }}/api-protocol-results.json
            ${{ runner.temp }}/api-media-results.json
            ${{ runner.temp }}/api-access-results.json
            ${{ runner.temp }}/bot-results.json
            ${{ runner.temp }}/bot-catalog-results.json
            ${{ runner.temp }}/api-purge-sync-results.json
            ${{ runner.temp }}/purge-results.json
            ${{ runner.temp }}/pattern-results.json
            ${{ runner.temp }}/revalidate-results.json
