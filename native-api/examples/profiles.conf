# Include once in each server managed by native-edge. Copy proxy-common.conf
# to /etc/scdn/ or adjust these fixed include paths for your installation.
# Edge emits X-Cache / X-Cache-Layer / X-Cache-Policy / X-Cache-Revision.
# Configure cache_headers and cache_request_header in the watched site data.
scdn_api on;
scdn_api_inspect_body 16k;
scdn_api_stream_timeout 600s;
scdn_api_dynamic_location @scdn_api;
scdn_api_ai_location @scdn_ai;
scdn_api_stream_location @scdn_stream;
scdn_api_grpc_location @scdn_grpc;
scdn_api_websocket_location @scdn_websocket;

location @scdn_edge_proxy {
    include /etc/scdn/proxy-common.conf;
    proxy_cache $scdn_edge_cache;
    proxy_cache_key "$scdn_api_cache_namespace|$scdn_edge_revision|$host|$request_uri";
    proxy_cache_bypass $scdn_api_skip_cache;
    proxy_no_cache $scdn_api_skip_cache;
    proxy_cache_valid 200 1m;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
location @scdn_api {
    include /etc/scdn/proxy-common.conf;
    proxy_cache off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_next_upstream off;
}
location @scdn_ai {
    include /etc/scdn/proxy-common.conf;
    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_next_upstream off;
    gzip off;
}
location @scdn_stream {
    include /etc/scdn/proxy-common.conf;
    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_next_upstream off;
    gzip off;
}
location @scdn_websocket {
    include /etc/scdn/proxy-common.conf;
    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_next_upstream off;
    gzip off;
}
location @scdn_grpc {
    grpc_pass $scdn_edge_grpc_upstream;
    grpc_set_header Host $scdn_edge_origin_host;
    grpc_ssl_server_name on;
    grpc_ssl_name $scdn_edge_origin_sni;
    grpc_ssl_verify on;
    grpc_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    grpc_ssl_verify_depth 3;
    grpc_connect_timeout 5s;
    grpc_read_timeout 600s;
    grpc_send_timeout 600s;
    grpc_next_upstream off;
}
