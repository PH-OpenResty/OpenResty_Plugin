# Included inside each HTTP proxy location. Set the OS CA path for your host.
proxy_pass $scdn_edge_upstream;
proxy_http_version 1.1;
proxy_set_header Host $scdn_edge_origin_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $scdn_api_connection;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# The edge may compress ordinary responses. Keep upstream streams uncompressed
# so response-based SSE detection can flush them without compressor buffering.
proxy_set_header Accept-Encoding "";
proxy_ssl_server_name on;
proxy_ssl_name $scdn_edge_origin_sni;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_verify_depth 3;
proxy_ssl_session_reuse on;
proxy_connect_timeout 5s;
proxy_ignore_client_abort off;
