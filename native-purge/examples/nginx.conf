load_module modules/ngx_http_scdn_purge_module.so;
user scdn scdn;
worker_processes 2;
thread_pool scdn_cache_purge threads=2 max_queue=64;
pid /run/scdn-purge/nginx.pid;
error_log stderr warn;
events { worker_connections 4096; }
http {
    access_log off;
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    client_body_timeout 5s;
    scdn_purge_zone epochs 16m;
    scdn_purge_journal /var/lib/scdn-purge/epochs.log;
    scdn_purge_token_file /etc/scdn-purge/control.token;
    scdn_purge_cache_entries 1024;
    scdn_purge_checkpoint 64m;
    scdn_purge_allow_all off;
    proxy_cache_path /var/cache/scdn/content levels=1:2 keys_zone=content:16m
                     max_size=10g inactive=30m use_temp_path=off;
    server {
        listen unix:/run/scdn-purge/control.sock;
        server_name localhost;
        location = /purge { scdn_purge_api; }
        location = /status { scdn_purge_status; }
    }
    server {
        listen 8081;
        server_name www.example.com;
        location / {
            # Preserve all original key dimensions. The optional final argument
            # selects a logical purge resource, so URL prefixes remain usable.
            scdn_purge_key "$scheme|$host" "$scheme|$proxy_host|$request_uri" "$request_uri";
            proxy_cache_key $scdn_purge_key;
            proxy_cache content;
            proxy_cache_valid 200 10m;
            proxy_cache_lock on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_pass http://127.0.0.1:8080;
            add_header X-Cache $upstream_cache_status always;
        }
    }
}
