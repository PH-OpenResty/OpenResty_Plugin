# Complete transactional snapshot. Publish this file with atomic rename.
sites {
    site demo {
        host www.example.com;
        enabled off;
        upstream http://127.0.0.1:8080;
        cache off;
        # Optional certificate files are read and preloaded in the background.
        # certificate /etc/scdn/certificates/demo.crt;
        # certificate_key /etc/scdn/certificates/demo.key;
        prefix /api/ {
            upstream http://127.0.0.1:9000;
            cache off;
        }
    }
}
