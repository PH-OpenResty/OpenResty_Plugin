# Independent Auth Guard example. Use a module built for this exact runtime.
load_module modules/ngx_http_scdn_auth_guard_module.so;
worker_processes auto;
events { worker_connections 1024; }
http {
    scdn_auth_policy /etc/scdn/auth/policy.json;
    scdn_auth_zone authentication 64m;
    upstream auth_application { server 127.0.0.1:8080; keepalive 16; }
    server {
        listen 8081;
        scdn_auth_guard sub2api-main;
        scdn_auth_mode enforce;
        # Preserve existing application/WAF/access controls in this server.
        location / {
            proxy_pass http://auth_application;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_next_upstream off;
            proxy_cache off;
            access_log off;
        }
    }
    # Unix socket is available only to the explicitly trusted app/admin user.
    # For remote Nodes use a private HTTPS listener with equivalent ACLs/TLS.
    server {
        listen unix:/run/scdn/auth-control.sock;
        scdn_auth_guard off;
        access_log off;
        location = / { scdn_auth_control; }
        location = /status { scdn_auth_status; }
    }
}
