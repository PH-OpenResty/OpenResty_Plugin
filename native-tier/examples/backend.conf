# Unix-only local L2 handler; native-tier checks transport and instance token.
scdn_tier_backend;
proxy_pass $scdn_tier_origin;
proxy_cache $scdn_tier_cache;
proxy_cache_key "$scdn_tier_scope|$scdn_tier_key";
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_lock_age 10s;
proxy_cache_valid 200 10m;
proxy_cache_revalidate on;
proxy_cache_bypass $scdn_tier_validate;
proxy_no_cache $scdn_tier_no_store;
proxy_http_version 1.1;
proxy_set_header Host $scdn_tier_host;
proxy_set_header Connection "";
proxy_set_header If-None-Match $http_if_none_match;
proxy_set_header If-Modified-Since $http_if_modified_since;
proxy_set_header X-Tier-Token "";
proxy_set_header X-Tier-Origin "";
proxy_set_header X-Tier-Host "";
proxy_set_header X-Tier-SNI "";
proxy_set_header X-Tier-Scope "";
proxy_set_header X-Tier-Key "";
proxy_set_header X-Tier-Resource "";
proxy_set_header X-Tier-Validate "";
proxy_ssl_server_name on;
proxy_ssl_name $scdn_tier_sni;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_buffer_size 32k;
proxy_buffers 8 32k;
proxy_connect_timeout 3s;
proxy_read_timeout 30s;
