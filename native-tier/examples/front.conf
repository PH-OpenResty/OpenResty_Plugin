# Include inside the frontend HTTP proxy location after scdn_tier_front/identity.
proxy_pass $scdn_tier_upstream;
proxy_cache $scdn_tier_cache;
proxy_cache_key "$scdn_tier_scope|$scdn_tier_key";
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
proxy_cache_lock_age 10s;
proxy_cache_valid 200 10m;
proxy_no_cache $scdn_tier_no_store;
proxy_http_version 1.1;
proxy_set_header Host $scdn_tier_host;
proxy_set_header Connection "";
proxy_set_header X-Clinet-IP $remote_addr;
proxy_set_header X-Tier-Token $scdn_tier_token;
proxy_set_header X-Tier-Origin $scdn_tier_wire_origin;
proxy_set_header X-Tier-Host $scdn_tier_wire_host;
proxy_set_header X-Tier-SNI $scdn_tier_wire_sni;
proxy_set_header X-Tier-Scope $scdn_tier_wire_scope;
proxy_set_header X-Tier-Key $scdn_tier_wire_key;
proxy_set_header X-Tier-Resource $scdn_tier_wire_resource;
proxy_set_header X-Tier-Validate $scdn_tier_validate;
proxy_ssl_server_name on;
proxy_ssl_name $scdn_tier_sni;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_buffer_size 32k;
proxy_buffers 8 32k;
proxy_connect_timeout 3s;
proxy_read_timeout 30s;
