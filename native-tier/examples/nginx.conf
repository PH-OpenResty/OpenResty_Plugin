load_module modules/ngx_http_scdn_tier_module.so;
user scdn scdn;
worker_processes 2;
pid /run/scdn-tier/nginx.pid;
error_log stderr warn;
events { worker_connections 4096; }
http {
    access_log off;
    scdn_tier_zone hot 1m;
    scdn_tier_socket /run/scdn-tier/l2.sock;
    scdn_tier_heat 3 90m;
    # L1 may be tmpfs; L2 is persistent storage. Choose sizes for the host.
    proxy_cache_path /var/cache/scdn/l1 levels=1:2 keys_zone=l1:16m max_size=1g inactive=90m;
    proxy_cache_path /var/cache/scdn/l2 levels=1:2 keys_zone=l2:64m max_size=10g inactive=1d;
    server {
        listen unix:/run/scdn-tier/l2.sock;
        server_name localhost;
        large_client_header_buffers 4 16k;
        location = /_tier_status { scdn_tier_status; }
        location / { include /etc/scdn-tier/backend.conf; }
    }
    server {
        listen 8081;
        server_name www.example.com;
        location / {
            scdn_tier_front auto http://127.0.0.1:8080;
            scdn_tier_identity $host 127.0.0.1 "$scheme|$host" "$scheme|$host|$request_uri" $request_uri;
            scdn_tier_max_size 512m 32g;
            include /etc/scdn-tier/front.conf;
        }
    }
}
