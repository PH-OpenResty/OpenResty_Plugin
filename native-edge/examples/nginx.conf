load_module modules/ngx_http_scdn_config_module.so;
load_module modules/ngx_http_scdn_edge_module.so;
user scdn scdn;
worker_processes 2;
thread_pool scdn_config_reader threads=1 max_queue=2;
pid /run/scdn-edge/nginx.pid;
error_log stderr warn;
events { worker_connections 4096; }
http {
    access_log off;
    server_tokens off;
    scdn_config_zone configurations 128k;
    scdn_config_watch /etc/scdn/sites.conf;
    scdn_config_interval 250ms;
    scdn_config_settle 500ms;
    scdn_config_allow_empty off;
    scdn_edge_zone counters 2m;
    proxy_cache_path /var/cache/scdn/l1 keys_zone=l1:16m;
    proxy_cache_path /var/cache/scdn/l2 keys_zone=l2:64m;

    server {
        listen unix:/run/scdn-edge/control.sock;
        server_name localhost;
        location = /status { scdn_config_status; }
        location = /metrics { scdn_edge_metrics; }
    }
    server {
        listen 80 default_server;
        server_name _;
        scdn_edge on;
        # For TLS, provide a local bootstrap pair and enable the native callback:
        # listen 443 ssl default_server;
        # ssl_certificate /etc/scdn/bootstrap.crt;
        # ssl_certificate_key /etc/scdn/bootstrap.key;
        # ssl_session_cache off;
        # ssl_session_tickets off;
        # scdn_edge_tls on;
        add_header X-Config-Revision $scdn_edge_revision always;
        location / {
            root $scdn_edge_root;
            disable_symlinks on;
        }
        location @scdn_edge_proxy {
            proxy_pass $scdn_edge_upstream;
            proxy_cache $scdn_edge_cache;
            # A route change must not return old-origin objects from the cache.
            proxy_cache_key "$scdn_edge_revision|$host|$request_uri";
            proxy_cache_valid 200 1m;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
    }
}
