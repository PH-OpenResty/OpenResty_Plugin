# Include in http alongside Node identity/control and a native Purge instance.
# Main context also needs: thread_pool scdn_sync_tasks threads=1 max_queue=16;
# Use an independent Purge token and precreate this directory as worker-owned 0700.
scdn_sync_cache_tasks /var/lib/scdn-sync-native/node/cache-tasks;
scdn_sync_cache_master https://sync.example.com:8443;
scdn_sync_cache_mtls /etc/scdn-sync-native/node/pki/master-ca.crt
    /etc/scdn-sync-native/node/pki/node.crt /etc/scdn-sync-native/node/pki/node.key;
scdn_sync_cache_purge /run/scdn-purge/control.sock /etc/scdn-purge/control.token /purge;
scdn_sync_cache_site "http|www.example.com" http://www.example.com:8081;
# Uses system CA by default. Override only for a private local HTTPS trust chain:
# scdn_sync_cache_local_ca /etc/scdn-sync-native/node/pki/business-ca.crt;
scdn_sync_cache_poll 1s;
scdn_sync_cache_allow_all off;
# The business entry must be reachable on 127.0.0.1 at this URL's port, and return:
# add_header X-Cache $upstream_cache_status always;
