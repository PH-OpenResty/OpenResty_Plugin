# First milestone: local status/control boundary, not an active pull agent.
load_module modules/ngx_http_scdn_sync_module.so;
worker_processes auto;
pid /run/scdn-sync-native-node/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    server_tokens off;
    client_header_timeout 5s;
    client_body_timeout 5s;
    keepalive_timeout 10s;

    scdn_sync_role node;
    scdn_sync_id node-a;
    scdn_sync_scope edge;
    scdn_sync_control_token_file /etc/scdn-sync-native/node/control.token;

    server {
        listen unix:/run/scdn-sync-native-node/control.sock;
        server_name localhost;
        location /__scdn_sync/v1/ { scdn_sync_api control; }
        location / { return 404; }
    }
}
