# Include in http alongside the Master role/peer/control/exchange settings.
# Main context also needs: thread_pool scdn_sync_tasks threads=1 max_queue=16;
# Precreate the directory as 0700, owned by the actual worker account.
scdn_sync_cache_tasks /var/lib/scdn-sync-native/master/cache-tasks;
scdn_sync_cache_allow_all off;
client_max_body_size 64k;
client_body_buffer_size 128k;
