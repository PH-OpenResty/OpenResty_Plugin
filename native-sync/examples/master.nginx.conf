# First milestone: authenticated identity/capability endpoints, not publication.
load_module modules/ngx_http_scdn_sync_module.so;
worker_processes auto;
pid /run/scdn-sync-native-master/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    server_tokens off;
    client_header_timeout 5s;
    client_body_timeout 5s;
    keepalive_timeout 10s;

    scdn_sync_role master;
    scdn_sync_id master-a;
    scdn_sync_control_token_file /etc/scdn-sync-native/master/control.token;
    # Register each node and scope using the SHA-256 digest of its leaf DER.
    # scdn_sync_peer node-a edge REPLACE_WITH_64_LOWERCASE_HEX_CHARACTERS;

    server {
        listen unix:/run/scdn-sync-native-master/control.sock;
        server_name localhost;
        location /__scdn_sync/v1/ { scdn_sync_api control; }
        location / { return 404; }
    }
    server {
        listen 8443 ssl;
        server_name sync.example.com;
        ssl_certificate /etc/scdn-sync-native/master/pki/master.crt;
        ssl_certificate_key /etc/scdn-sync-native/master/pki/master.key;
        ssl_client_certificate /etc/scdn-sync-native/master/pki/node-ca.crt;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        location /_scdn_sync/v1/ { scdn_sync_api exchange; }
        location / { return 404; }
    }
}
