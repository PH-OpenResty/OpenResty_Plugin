# Load before API/Edge modules compiled with Ban support.
load_module modules/ngx_http_scdn_ban_module.so;
# In http:
# scdn_ban_agent /run/scdn-ban/events.sock 0 00000000-0000-0000-0000-000000000100;
# In each protected Edge server:
# scdn_ban on;
# scdn_ban_scope $scdn_edge_site;
# For a standalone server, supply an explicit stable site ID:
# scdn_ban_scope demo;
# WAF/CC integrations must call the C API or writable module variables only
# after a trusted detector has confirmed an event. Never map client headers.
